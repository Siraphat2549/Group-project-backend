# Disposable MySQL + Redis for integration / E2E tests.
#   npm run test:db:up     # start (waits until healthy)
#   npm run test:db:down   # stop and delete everything
# Different ports (3307 / 6380) and project name from docker-compose.yml, so it
# never touches the dev database. Data lives in tmpfs (RAM): fast, gone on stop.
# Credentials here are throwaway test-only values, not secrets.
name: hotel-booking-test

services:
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hotel_booking_test
      MYSQL_USER: hotel_test
      MYSQL_PASSWORD: hotel_test
      MYSQL_ROOT_PASSWORD: hotel_test_root
    ports:
      - '${TEST_MYSQL_PORT:-3307}:3306'
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  redis-test:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '${TEST_REDIS_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 10
